{% extends "base.html" %}

{% block content %}
<h1 class="text-3xl font-bold tracking-tight">Taskboard</h1>
<p class="mt-1 text-sm text-slate-500">Django + HTMX + Tailwind + PostgreSQL</p>

<form class="mt-8 flex gap-2"
      hx-post="{% url 'tasks:create' %}"
      hx-target="#task-list"
      hx-swap="afterbegin"
      hx-on::after-request="if (event.detail.successful) this.reset()">
  <input name="title" type="text" required maxlength="200" placeholder="What needs doing?"
         class="flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
  <button type="submit"
          class="rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white shadow-sm hover:bg-indigo-500">
    Add
  </button>
</form>

<ul id="task-list" class="mt-6 divide-y divide-slate-200 rounded-lg border border-slate-200 bg-white shadow-sm empty:hidden">
  {% for task in tasks %}{% include "tasks/_task.html" %}{% endfor %}
</ul>
{% endblock %}
